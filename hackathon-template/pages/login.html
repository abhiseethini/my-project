<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Hackathon Template</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">Hackathon</a>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to your account</p>

      <div id="auth-error" class="alert alert-error" hidden></div>
      <div id="auth-success" class="alert alert-success" hidden></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" id="forgot-password-link" class="forgot-password-link">Forgot Password?</a>
          </div>
          <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <button type="button" id="google-signin-btn" class="btn btn-google btn-block">
        Continue with Google
      </button>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="modal-overlay" aria-hidden="true" hidden>
    <div class="modal-card" role="dialog" aria-labelledby="forgot-modal-title">
      <div class="modal-header">
        <h2 id="forgot-modal-title">Reset Password</h2>
        <button type="button" class="modal-close" id="close-forgot-modal" aria-label="Close modal">&times;</button>
      </div>
      <p class="modal-subtitle">Enter your registered email address and we'll send you instructions to reset your password.</p>

      <div id="forgot-error" class="alert alert-error" hidden></div>
      <div id="forgot-success" class="alert alert-success" hidden></div>

      <form id="forgot-password-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">Email Address</label>
          <input type="email" id="forgot-email" name="forgotEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancel-forgot-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="forgot-submit-btn">Send Reset Link</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
