<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Details — Campus Lost & Found</title>
  <meta name="description" content="View detailed information about a lost or found item report on Campus Lost & Found.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/report.css">
</head>
<body class="app-body">

  <!-- Header -->
  <header class="report-header">
    <div class="report-header-inner">
      <a href="dashboard.html" class="brand">
        <span class="brand-icon" aria-hidden="true">🏫</span>
        <span class="brand-text">Campus <strong>Lost &amp; Found</strong></span>
      </a>
      <a href="dashboard.html" class="btn-back" id="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to Dashboard
      </a>
    </div>
  </header>

  <!-- Loading State -->
  <div id="report-loading" class="report-loading-state">
    <div class="loading-card">
      <div class="loading-spinner-ring">
        <div></div><div></div><div></div><div></div>
      </div>
      <p class="loading-text">Loading report details…</p>
    </div>
  </div>

  <!-- Error State -->
  <div id="report-error" class="report-error-state" hidden>
    <div class="error-card">
      <div class="error-icon-wrap">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <h2>Report Not Found</h2>
      <p id="error-message">The report you're looking for could not be found or may have been deleted.</p>
      <a href="dashboard.html" class="btn-action btn-action-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        Go to Dashboard
      </a>
    </div>
  </div>

  <!-- Report Content (populated by JS) -->
  <main id="report-content" class="report-content-wrap" hidden></main>

  <!-- Success Toast -->
  <div id="success-toast" class="success-toast" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
    <span>Report submitted successfully!</span>
  </div>

  <script type="module" src="../js/report.js"></script>
</body>
</html>
