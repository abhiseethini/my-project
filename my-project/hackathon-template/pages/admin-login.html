<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Campus Lost & Found</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/admin-login.css">
</head>
<body>
  <div class="auth-page admin-auth-page">
    <div class="auth-card admin-auth-card">
      <a href="index.html" class="auth-logo">Campus Lost &amp; Found <span class="badge badge-admin">Admin Portal</span></a>
      <h1>Admin Login</h1>
      <p class="auth-subtitle">Sign in to access administrator dashboard</p>

      <div id="auth-error" class="alert alert-error" hidden></div>
      <div id="auth-success" class="alert alert-success" hidden></div>

      <form id="admin-login-form" class="auth-form">
        <div class="form-group">
          <label for="admin-email">Email</label>
          <input type="email" id="admin-email" name="email" required placeholder="admin@college.edu" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-admin" id="admin-login-btn">Login as Admin</button>
      </form>

      <p class="auth-footer">
        Don't have an admin account? <a href="admin-signup.html" class="back-link">Register as Admin</a>
        <br>
        <a href="login.html" class="back-link" style="font-size: 0.8rem; margin-top: 0.5rem;">&larr; Back to User Login</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/admin.js"></script>
</body>
</html>
