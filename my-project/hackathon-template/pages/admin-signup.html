<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Signup — Campus Lost & Found</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/admin-login.css">
</head>
<body>
  <div class="auth-page admin-auth-page">
    <div class="auth-card admin-auth-card">
      <a href="index.html" class="auth-logo">Campus Lost &amp; Found <span class="badge badge-admin">Admin Portal</span></a>
      <h1>Admin Registration</h1>
      <p class="auth-subtitle">Create a new administrator account</p>

      <div id="auth-error" class="alert alert-error" hidden></div>
      <div id="auth-success" class="alert alert-success" hidden></div>

      <form id="admin-signup-form" class="auth-form">
        <div class="form-group">
          <label for="admin-name">Full Name</label>
          <input type="text" id="admin-name" name="name" required placeholder="Campus Admin" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" name="email" required placeholder="admin@college.edu" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" name="password" required placeholder="••••••••" minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="admin-secret">Admin Registration Code (Secret Key)</label>
          <input type="password" id="admin-secret" name="secretKey" required placeholder="Enter admin secret key" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-admin" id="admin-signup-btn">Register as Admin</button>
      </form>

      <p class="auth-footer">
        Already have an admin account? <a href="admin-login.html" class="back-link">Admin Login</a>
        <br>
        <a href="login.html" class="back-link" style="font-size: 0.8rem; margin-top: 0.5rem;">&larr; Back to User Login</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/admin.js"></script>
</body>
</html>
