<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Hackathon Template</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">Hackathon</a>
      <h1>Create account</h1>
      <p class="auth-subtitle">Join and start building</p>

      <div id="auth-error" class="alert alert-error" hidden></div>
      <div id="auth-success" class="alert alert-success" hidden></div>

      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label for="displayName">Name</label>
          <input type="text" id="displayName" name="displayName" required placeholder="Your name" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Min. 6 characters" autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
